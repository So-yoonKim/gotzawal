<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>곶자왈 탐험 3D — Jeju Gotjawal</title>
    <style>
        :root { --moss: #7ccf4b; --moss-dark: #2f6f2a; --orange: #e8641f; --cream: #fbe3bf; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #7fb7e8; user-select: none; -webkit-user-select: none; touch-action: none;
            font-family: "Trebuchet MS", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
        .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .layer > * { pointer-events: auto; }

        /* ---- 점토 느낌 글자/버튼 ---- */
        h1 { margin: 0; font-size: clamp(44px, 9vw, 92px); font-weight: 900; letter-spacing: 0.02em; color: #86d957; line-height: 1.05; text-align: center;
            -webkit-text-stroke: 3px #2f6f2a; paint-order: stroke fill;
            text-shadow: 0 3px 0 #3b8a2e, 0 6px 0 #2f6f2a, 0 10px 14px rgba(20, 60, 20, .45), inset 0 0 8px #fff; }
        .sub { color: #fff; letter-spacing: .5em; font-size: 13px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.35); }
        .clay { border: 0; cursor: pointer; border-radius: 999px; font: 800 24px "Trebuchet MS", "Malgun Gothic", sans-serif; display: flex; align-items: center; justify-content: center; gap: 12px;
            width: min(300px, 70vw); padding: 15px 0; transition: transform .12s; }
        .clay:hover { transform: translateY(-2px) scale(1.03); } .clay:active { transform: translateY(3px); }
        .clay.play { color: #fff; background: radial-gradient(ellipse at 30% 20%, #ff9a55, var(--orange) 55%, #c4480f);
            box-shadow: inset 0 6px 8px rgba(255,255,255,.35), inset 0 -8px 10px rgba(0,0,0,.22), 0 8px 0 #9c3f10, 0 14px 22px rgba(0,0,0,.3); }
        .clay.alt { color: #5a3a1f; background: radial-gradient(ellipse at 30% 20%, #fff2dd, var(--cream) 55%, #e8c997);
            box-shadow: inset 0 6px 8px rgba(255,255,255,.6), inset 0 -8px 10px rgba(120,80,30,.2), 0 8px 0 #b99560, 0 14px 22px rgba(0,0,0,.25); }
        #title { padding-top: 6vh; gap: 16px; } #menu { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; align-items: center; }
        #about { margin-top: 4px; width: min(560px, 92vw); text-align: center; color: #fff; font-size: 14px; line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,.6); background: rgba(40, 70, 40, .35); border-radius: 18px; padding: 8px 14px; pointer-events: none; }

        /* ---- 패널(설정/일시정지/결과) ---- */
        #panel { justify-content: center; background: rgba(20, 40, 25, .45); display: none; }
        #panel .card { background: radial-gradient(ellipse at 30% 10%, #fff7e8, #f6dcae 70%); color: #5a3a1f; border-radius: 34px; padding: 26px 30px; width: min(420px, 88vw);
            text-align: center; box-shadow: inset 0 6px 10px #fff, inset 0 -10px 14px rgba(120,80,30,.2), 0 10px 0 #b99560, 0 22px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px; align-items: center; }
        .card h2 { margin: 0; font-size: 30px; color: var(--moss-dark); } .card p { margin: 0; line-height: 1.55; font-size: 15px; }
        .card .clay { width: 100%; font-size: 20px; padding: 12px 0; }
        .row { display: flex; gap: 10px; width: 100%; } .row .clay { flex: 1; }
        .pill.on { outline: 4px solid #7ccf4b; }

        /* ---- 알림, 상단 버튼, 터치 조작 ---- */
        #toast { position: fixed; top: 74px; left: 50%; transform: translate(-50%, -20px); opacity: 0; transition: .35s; max-width: min(520px, 92vw); text-align: center;
            background: radial-gradient(ellipse at 30% 10%, #fff7e8, #f6dcae); color: #5a3a1f; border-radius: 22px; padding: 10px 18px; font-weight: 700; font-size: 15px; line-height: 1.45;
            box-shadow: inset 0 4px 6px #fff, 0 6px 0 #b99560, 0 12px 18px rgba(0,0,0,.3); pointer-events: none; }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #topbtns { position: fixed; top: 12px; right: 12px; display: none; gap: 10px; }
        .round { width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; color: #fff; font-size: 20px; font-weight: 900;
            background: radial-gradient(ellipse at 30% 20%, #5a7a5a, #2f4a35); box-shadow: inset 0 4px 5px rgba(255,255,255,.3), 0 4px 0 #1b2f20, 0 8px 12px rgba(0,0,0,.3); }
        #touch { position: fixed; left: 0; right: 0; bottom: 0; height: 150px; display: none; pointer-events: none; }
        #touch > div { pointer-events: auto; display: flex; gap: 14px; position: absolute; bottom: 22px; touch-action: none; }
        #dpad { left: 50%; transform: translateX(-50%); }
        #jumpbox { right: 22px; }
        #touch button { -webkit-tap-highlight-color: transparent; touch-action: none; }
        .tbtn { width: 78px; height: 78px; border-radius: 50%; border: 0; color: #fff; font-size: 30px; font-weight: 900;
            background: radial-gradient(ellipse at 30% 20%, #ff9a55, var(--orange) 60%, #c4480f); box-shadow: inset 0 5px 7px rgba(255,255,255,.35), 0 6px 0 #9c3f10, 0 12px 16px rgba(0,0,0,.3); }
        .tbtn.move { background: radial-gradient(ellipse at 30% 20%, #6e8c6e, #35523a 65%); box-shadow: inset 0 5px 7px rgba(255,255,255,.3), 0 6px 0 #1b2f20, 0 12px 16px rgba(0,0,0,.3); }
        .tbtn:active { transform: translateY(4px); }
        #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 52%, rgba(60, 35, 10, .38) 100%); }
        #hud { position: fixed; inset: 0; display: none; pointer-events: none; }
        #hHearts { position: absolute; left: 14px; top: 10px; font-size: 30px; line-height: 46px; letter-spacing: 2px; }
        #hHearts span { color: rgba(255,255,255,.5); text-shadow: 0 2px 0 rgba(90,50,30,.5); } #hHearts span.on { color: #ff4b5c; }
        #hMid { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: rgba(255, 244, 220, .78); border-radius: 22px; padding: 6px 16px 9px; box-shadow: inset 0 3px 4px #fff, 0 4px 0 #b99560, 0 8px 14px rgba(0,0,0,.25); color: #5a3a1f; }
        #hRow { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 20px; }
        #hSlots { display: flex; gap: 6px; } #hSlots i { font-style: normal; font-size: 20px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: #e6dcc6; filter: grayscale(1); opacity: .45; } #hSlots i.have { background: #ffe9a8; filter: none; opacity: 1; box-shadow: 0 0 10px #ffd45a; }
        #hBar { width: 180px; height: 8px; border-radius: 4px; background: #e6dcc6; overflow: hidden; } #hFill { display: block; height: 100%; width: 0; background: #7ccf4b; border-radius: 4px; }
        #toast { top: 150px; }    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="vig"></div>
    <div id="hud"><div id="hHearts"></div><div id="hMid"><div id="hRow"><span>🌰 <b id="hScore">0</b></span><div id="hSlots"></div></div><div id="hBar"><i id="hFill"></i></div></div></div>

    <div id="title" class="layer">
        <h1>곶자왈<br>탐험</h1>
        <div class="sub">3D DEMO · JEJU GOTJAWAL</div>
        <div id="menu">
            <button class="clay play" id="btnPlay">▶ Play</button>
            <button class="clay alt" id="btnSettings">⚙ Settings</button>
        </div>
        <div id="about">곶자왈은 용암이 흘러 굳은 돌밭 위에 자란 제주의 숲이에요.<br>돌 틈의 비밀을 찾아 숲을 가로질러 보세요!</div>
    </div>

    <div id="topbtns"><button class="round" id="btnSnd" title="소리 켜기/끄기">🔊</button><button class="round" id="btnPause" title="일시정지">❚❚</button><button class="round" id="btnFull" title="전체화면">⛶</button></div>
    <div id="toast"></div>
    <div id="touch">
        <div id="dpad"><button class="tbtn move" id="tLeft">◀</button><button class="tbtn move" id="tRight">▶</button></div>
        <div id="jumpbox"><button class="tbtn" id="tJump">▲</button></div>
    </div>
    <div id="panel" class="layer"><div class="card" id="card"></div></div>

    <div id="loadfail" style="display:none;position:fixed;inset:0;z-index:99;background:rgba(40,70,40,.94);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font:700 18px 'Malgun Gothic',sans-serif">
        <div>3D 화면을 불러오지 못했어요 😢</div>
        <div style="font-size:14px;font-weight:400;line-height:1.7">인터넷 연결(three.js 라이브러리)이나 브라우저의 WebGL 설정을 확인하고 새로고침해 주세요.<br>안 되면 2D 버전으로 플레이할 수 있어요.</div>
        <a href="gotjawal.html" style="color:#ffe9a8">2D 버전으로 열기</a>
    </div>
    <script>setTimeout(function () { if (!window.__g3dReady) document.getElementById("loadfail").style.display = "flex" }, 8000)</script>
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
    <script type="module">
        import * as THREE from "three"
        import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js"
        // ====================================================== 기본 설정
        const cv = document.getElementById("c")
        const H = 540, GY = 440, LEN = 7100, GOAL = 6800, START_X = 300

        const rnd = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v) }

        // ====================================================== 레벨 데이터
        const grounds = [[-400, 880], [1030, 1800], [1950, 2500], [2660, 3500], [3650, 4400], [4560, 5300], [5450, 7300]]
        const platforms = [[400, 340, 140], [1200, 330, 120], [1450, 300, 120], [2200, 340, 160], [2900, 330, 130], [3150, 300, 120],
                           [3900, 340, 150], [4700, 330, 140], [5000, 300, 110], [5900, 340, 150]].map(([x, y, w]) => ({ x, y, w }))
        const hazards = [[600, "rock"], [750, "thorn"], [1350, "rock"], [1600, "thorn"], [2300, "rock"], [2400, "thorn"], [3000, "rock"], [3300, "rock"],
                         [3400, "thorn"], [4000, "rock"], [4200, "thorn"], [4900, "rock"], [5150, "thorn"], [5600, "rock"], [5800, "thorn"], [6200, "rock"], [6400, "thorn"]]
            .map(([x, type]) => ({ x, type, w: type === "rock" ? 52 : 56, h: type === "rock" ? 38 : 38 }))
        const surfaces = [...grounds.map(([a, b]) => ({ x0: a, x1: b, y: GY, ground: true })), ...platforms.map((p) => ({ x0: p.x, x1: p.x + p.w, y: p.y }))]

        const TREASURES = [
            { type: "camellia", x: 1260, y: 285, name: "동백꽃", fact: "동백꽃 — 겨울에 붉게 피는 꽃이에요. 선흘 곶자왈의 동백동산에서 큰 동백나무 숲을 볼 수 있어요." },
            { type: "fern", x: 2965, y: 285, name: "고사리", fact: "고사리 — 돌 틈의 촉촉한 공기를 좋아해서 곶자왈 바닥을 푸르게 덮어요." },
            { type: "mushroom", x: 3975, y: 295, name: "버섯", fact: "버섯 — 떨어진 낙엽을 분해해 숲에 영양분을 돌려주는 숲의 청소부예요." },
            { type: "acorn", x: 5055, y: 255, name: "도토리", fact: "도토리 — 종가시나무 같은 참나뭇과 나무의 열매예요. 곶자왈에는 이런 늘푸른나무가 많아요." },
        ]
        let acorns = [], treasures = [], got = new Set()

        const buildItems = () => {
            acorns = []
            for (const [a, b] of grounds) {
                for (let x = Math.max(a, 120) + 110; x < Math.min(b, LEN) - 100; x += 150) {
                    const near = hazards.some((h) => Math.abs(h.x - x) < 75)
                    acorns.push({ x, y: near ? GY - 125 : GY - 55, taken: false, ph: rnd(x) * 6 })
                }
            }
            for (let i = 0; i < grounds.length - 1; i++)
                acorns.push({ x: (grounds[i][1] + grounds[i + 1][0]) / 2, y: GY - 150, taken: false, ph: i })
            for (const p of platforms) for (const dx of [0.25, 0.5, 0.75]) acorns.push({ x: p.x + p.w * dx, y: p.y - 42, taken: false, ph: dx * 9 })
            acorns = acorns.filter((a) => !TREASURES.some((t) => Math.hypot(t.x - a.x, t.y - a.y) < 36))
            treasures = TREASURES.map((t) => ({ ...t, taken: false }))
            got = new Set()
        }

        // ====================================================== 상태
        const P = { x: START_X, y: GY, vx: 0, vy: 0, dir: 1, onGround: true, w: 30, h: 58, inv: 0, stun: 0, walk: 0, safeX: START_X, coyote: 0, buffer: 0 }
        let state = "title", hearts = 3, maxHearts = 3, score = 0, camX = 0, time = 0, sparks = [], toastTimer = 0
        const keys = {}, touch = { left: false, right: false, jump: false }
        let jumpHeld = false

        const reset = () => {
            buildItems(); hearts = maxHearts; score = 0
            Object.assign(P, { x: START_X, y: GY, vx: 0, vy: 0, dir: 1, onGround: true, inv: 0, stun: 0, walk: 0, safeX: START_X })
            camX = 0
        }
        buildItems()

        // ====================================================== 입력
        addEventListener("keydown", (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault()
            if (e.repeat) return
            keys[e.key.toLowerCase()] = true
            if (["arrowup", " ", "w"].includes(e.key.toLowerCase())) { jumpHeld = true; P.buffer = 7 }
            if (e.key === "Escape" || e.key.toLowerCase() === "p") togglePause()
        })
        addEventListener("keyup", (e) => {
            keys[e.key.toLowerCase()] = false
            if (["arrowup", " ", "w"].includes(e.key.toLowerCase())) jumpHeld = false
        })
        const hold = (id, k) => {
            const el = document.getElementById(id)
            const on = (v) => (ev) => { ev.preventDefault(); if (k === "jump") { jumpHeld = touch.jumpBtn = v; if (v) P.buffer = 7 } else touch[k] = v }
            el.addEventListener("pointerdown", on(true)); el.addEventListener("pointerup", on(false))
            el.addEventListener("pointerleave", on(false)); el.addEventListener("pointercancel", on(false))
        }
        hold("tJump", "jump")
        // 방향 버튼: 누른 채 손가락을 좌우로 밀면 방향이 바뀌도록 패드 전체에서 위치로 판정
        const dpad = document.getElementById("dpad"), tl = document.getElementById("tLeft"), tr = document.getElementById("tRight")
        const dpadSet = (ev) => {
            const r = dpad.getBoundingClientRect(), mid = r.left + r.width / 2
            const inside = ev.clientX >= r.left - 30 && ev.clientX <= r.right + 30 && ev.clientY >= r.top - 40 && ev.clientY <= r.bottom + 40
            touch.left = inside && ev.clientX < mid; touch.right = inside && ev.clientX >= mid
        }
        dpad.addEventListener("pointerdown", (ev) => { ev.preventDefault(); try { dpad.setPointerCapture(ev.pointerId) } catch (e) {} dpadSet(ev) })
        dpad.addEventListener("pointermove", (ev) => { if (ev.buttons || ev.pressure > 0) dpadSet(ev) })
        const dpadOff = () => { touch.left = touch.right = false }
        dpad.addEventListener("pointerup", dpadOff); dpad.addEventListener("pointercancel", dpadOff)
        dpad.addEventListener("lostpointercapture", dpadOff)
        // 화면 아무 곳이나 탭하면 점프 (버튼 없이도 한 손 조작 가능)
        cv.addEventListener("pointerdown", (ev) => { if (ev.pointerType !== "mouse" && state === "play") { jumpHeld = true; P.buffer = 7 } })
        const tapEnd = () => { if (!touch.jumpBtn) jumpHeld = false }
        cv.addEventListener("pointerup", tapEnd); cv.addEventListener("pointercancel", tapEnd)
        if (matchMedia("(pointer: coarse)").matches || "ontouchstart" in window || innerWidth < 900) document.getElementById("touch").style.display = "block"

        // ====================================================== 소리 (효과음 · 배경음악 · 음성 안내)
        const AUD = { ctx: null, sfxBus: null, musicBus: null, music: true, sfx: true }
        try { Object.assign(AUD, JSON.parse(localStorage.getItem("gotjawalAudio") || "{}")) } catch (e) {}
        const saveAud = () => { try { localStorage.setItem("gotjawalAudio", JSON.stringify({ music: AUD.music, sfx: AUD.sfx })) } catch (e) {} }
        const initAudio = () => {
            if (!AUD.ctx) {
                const C = window.AudioContext || window.webkitAudioContext
                if (!C) return
                const c = AUD.ctx = new C()
                AUD.sfxBus = c.createGain(); AUD.sfxBus.gain.value = 0.8; AUD.sfxBus.connect(c.destination)
                AUD.musicBus = c.createGain(); AUD.musicBus.gain.value = 0.16; AUD.musicBus.connect(c.destination)
            }
            if (AUD.ctx.state === "suspended") AUD.ctx.resume()
        }
        const tone = (f, d, o = {}) => {
            if (!AUD.ctx) return
            const c = AUD.ctx, t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain()
            osc.type = o.type || "sine"; osc.frequency.setValueAtTime(f, t)
            if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d)
            g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d)
            osc.connect(g); g.connect(o.bus || AUD.sfxBus); osc.start(t); osc.stop(t + d + 0.05)
        }
        let noiseBuf = null
        const noise = (d, vol, freq) => {
            if (!AUD.ctx) return
            const c = AUD.ctx, t = c.currentTime
            if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 0.3, c.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1 }
            const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain()
            src.buffer = noiseBuf; f.type = "lowpass"; f.frequency.value = freq
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d)
            src.connect(f); f.connect(g); g.connect(AUD.sfxBus); src.start(t); src.stop(t + d)
        }
        const seq = (notes, step, o) => notes.forEach((f, i) => tone(f, step * 2.2, { ...o, at: i * step }))
        const sfx = {
            jump: () => { if (!AUD.sfx) return; tone(380, 0.22, { to: 980, vol: 0.2 }); tone(760, 0.18, { type: "triangle", to: 1500, vol: 0.08, at: 0.03 }) },
            land: () => AUD.sfx && tone(260, 0.1, { to: 150, vol: 0.18 }),
            step: () => AUD.sfx && tone(900 + Math.random() * 250, 0.045, { type: "triangle", vol: 0.07 }),
            acorn: () => { if (!AUD.sfx) return; tone(1175, 0.1, { type: "triangle", vol: 0.22 }); tone(1568, 0.22, { type: "triangle", vol: 0.22, at: 0.07 }) },
            treasure: () => AUD.sfx && seq([784, 988, 1175, 1568, 1976, 2349], 0.08, { type: "triangle", vol: 0.2 }),
            hurt: () => { if (!AUD.sfx) return; tone(700, 0.3, { to: 320, vol: 0.22 }); tone(350, 0.3, { to: 200, vol: 0.12 }) },
            fall: () => AUD.sfx && tone(1000, 0.7, { to: 180, vol: 0.2 }),
            win: () => AUD.sfx && seq([523, 659, 784, 1047, 784, 1047, 1319], 0.12, { type: "triangle", vol: 0.24 }),
            over: () => AUD.sfx && seq([659, 587, 523, 440], 0.2, { type: "sine", vol: 0.25 }),
            click: () => AUD.sfx && tone(900, 0.07, { to: 1400, vol: 0.12 })
        }
        // 배경음악: 오르골 같은 통통 튀는 아르페지오 (C - Am - F - G)
        const PROG = [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]]
        let mStep = 0, mNext = 0, mTimer = null
        const musicTick = () => {
            const c = AUD.ctx; if (!c) return
            if (mNext < c.currentTime) mNext = c.currentTime + 0.05
            while (mNext < c.currentTime + 0.6) {
                const ch = PROG[Math.floor(mStep / 8) % 4], n = mStep % 8, at = mNext - c.currentTime
                tone(ch[[0, 1, 2, 1, 2, 1, 2, 1][n]] * (n % 4 === 3 ? 4 : 2), 0.3, { type: "triangle", vol: 0.5, bus: AUD.musicBus, at })
                if (n === 0) tone(ch[0] / 2, 2.6, { type: "triangle", vol: 0.55, bus: AUD.musicBus, at })
                mNext += 0.3; mStep++
            }
        }
        const syncMusic = () => {
            const want = state === "play" && AUD.music && AUD.ctx
            if (want && !mTimer) { mNext = 0; mTimer = setInterval(musicTick, 200); musicTick() }
            if (!want && mTimer) { clearInterval(mTimer); mTimer = null }
        }
        addEventListener("pointerdown", initAudio); addEventListener("keydown", initAudio)

        const damage = () => {
            if (P.inv > 0) return

        // ====================================================== 3D 장면 (three.js) — 2D 좌표(px)를 월드 단위로 변환해서 같은 게임 로직을 3D로 보여줌

            } else if (type === "fern") {
                for (let k = 0; k < 7; k++) {
                    const o = mesh(new THREE.ConeGeometry(0.12, 0.9, 6), mat(0x4aa83a, 0.7), 0, 0, 0, g)
                    o.geometry = o.geometry.clone(); o.geometry.translate(0, 0.45, 0)
                    o.rotation.set((k % 2 ? 0.25 : -0.25), k * 0.9, (k - 3) * 0.28); o.scale.set(1, 1, 0.3)
                }
                g.position.y -= 0.35
            } else if (type === "mushroom") {
                mesh(new THREE.CylinderGeometry(0.12, 0.17, 0.4, 12), mat(0xf5e6c8, 0.7), 0, -0.1, 0, g)
                const cap = mesh(new THREE.SphereGeometry(0.42, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xe5483a, 0.6), 0, 0.08, 0, g); cap.scale.y = 0.85
                for (let k = 0; k < 6; k++) { const a = k * 1.05; mesh(new THREE.SphereGeometry(0.06, 8, 6), WHITE, Math.cos(a) * 0.25, 0.28 - (k % 2) * 0.06, Math.sin(a) * 0.25, g) }
            } else g.add(makeAcorn(1.9))
            const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true }))
            glow.scale.set(2.4, 2.4, 1); g.add(glow)
            const wrap = new THREE.Group(); wrap.add(g); wrap.userData.glow = glow; wrap.userData.spin = g
            return wrap
        }
        const itemsGroup = new THREE.Group(); scene.add(itemsGroup)
        let builtFor = null, acornObjs = [], treasureObjs = []
        const rebuildItems = () => {
            itemsGroup.clear(); acornObjs = []; treasureObjs = []
            for (const a of acorns) { const o = makeAcorn(1); o.position.set(wx(a.x), wy(a.y), 0); itemsGroup.add(o); acornObjs.push({ o, a }) }
            for (const t of treasures) { const o = makeTreasure(t.type); o.position.set(wx(t.x), wy(t.y), 0); itemsGroup.add(o); treasureObjs.push({ o, t }) }
            builtFor = acorns
        }

        // ---------- 결승 깃발
        {
            const g = new THREE.Group(); g.position.set(wx(GOAL), 0, 0); world.add(g)
            mesh(new THREE.CylinderGeometry(0.07, 0.09, 3.6, 8), mat(0x7a5233), 0, 1.8, 0, g)
            mesh(new THREE.SphereGeometry(0.15, 12, 10), mat(0xf2c53a, 0.4), 0, 3.65, 0, g)
            const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(1.4, -0.45); sh.lineTo(0, -0.9); sh.lineTo(0, 0)
            const flag = new THREE.Mesh(new THREE.ShapeGeometry(sh), new THREE.MeshStandardMaterial({ color: 0xe8641f, side: THREE.DoubleSide, roughness: 0.8 }))
            flag.position.set(0.05, 3.55, 0); flag.castShadow = true; g.add(flag); g.userData.flag = flag; world.userData.flag = flag
            mesh(rbox(1.6, 0.35, 1.6, 0.15), mat(0xa08a78, 0.95), 0, 0.17, 0, g)
        }

        // ---------- 하늘: 한라산, 구름, 해
        const far = new THREE.Group(); scene.add(far)
        const hMat = new THREE.MeshStandardMaterial({ color: 0x86b592, roughness: 1, fog: false })
        const hl = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 20, 0, Math.PI * 2, 0, Math.PI / 2), hMat); hl.scale.set(75, 26, 36); hl.position.set(10, -4, -130); far.add(hl)
        for (const [x, s, c] of [[-70, 0.7, 0x9ccaa0], [95, 0.8, 0x93c39a]]) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: c, roughness: 1, fog: false }))
            m.scale.set(40 * s, 12 * s, 24 * s); m.position.set(x, -3, -100); far.add(m)
        }
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(5, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe3a0, fog: false })); sunMesh.position.set(36, 30, -150); far.add(sunMesh)
        const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0.8 })); sunGlow.scale.set(60, 60, 1); sunGlow.position.copy(sunMesh.position); far.add(sunGlow)
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.4, fog: false })
        const clouds = []
        for (let i = 0; i < 12; i++) {
            const g = new THREE.Group(), n = 4 + Math.floor(R(i, 1) * 3)
            for (let k = 0; k < n; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), cloudMat); const r = 1 + R(i, k + 2) * 1.1; m.scale.set(r * 1.3, r, r); m.position.set((k - n / 2) * 1.7, (k % 2) * 0.5, R(i, k + 9) * 0.6); g.add(m) }
            g.userData = { bx: R(i, 4) * 140, y: 13 + R(i, 5) * 12, z: -55 - R(i, 6) * 40 }; g.scale.setScalar(1.4 + R(i, 7)); scene.add(g); clouds.push(g)
        }

        // ---------- 주인공 (점토 인형: 큰 머리, 통통한 몸, 구슬 눈, 발그레한 볼)
        const hero = new THREE.Group(); scene.add(hero)
        const heroIn = new THREE.Group(); hero.add(heroIn)
        const SKIN = mat(0xffd6b8, 1), HAIR = mat(0x7a4528, 1), JACKET = mat(0xffd23f, 1), PANTS = mat(0x8a5e3c, 1), SHOE = mat(0x5a3a22, 1), PACK = mat(0xe8641f, 1), SCARF = mat(0xe8641f, 1)
        const EYE = new THREE.MeshStandardMaterial({ color: 0x1c1210, roughness: 0.15 }), CHEEK = mat(0xff9a9a, 1), SHINE = new THREE.MeshBasicMaterial({ color: 0xffffff })
        const ball = (r, m, x, y, z, parent, sx = 1, sy = 1, sz = 1) => { const o = mesh(new THREE.SphereGeometry(r, 24, 18), m, x, y, z, parent); o.scale.set(sx, sy, sz); return o }
        // 몸: 배가 볼록한 배 모양 + 스카프 + 단추 + 배낭
        ball(0.31, JACKET, 0, 0.62, 0, heroIn, 1, 1.02, 0.98)
        const scarf = mesh(new THREE.TorusGeometry(0.2, 0.065, 14, 28), SCARF, 0, 0.9, 0, heroIn); scarf.rotation.x = Math.PI / 2
        ball(0.035, mat(0x7a4a26, 0.8), 0.3, 0.68, 0, heroIn); ball(0.035, mat(0x7a4a26, 0.8), 0.31, 0.54, 0, heroIn)
        mesh(rbox(0.16, 0.36, 0.34, 0.08), PACK, -0.3, 0.66, 0, heroIn)
        // 머리: 몸보다 큰 동그란 머리
        const head = new THREE.Group(); head.position.set(0, 1.14, 0); heroIn.add(head)
        ball(0.45, SKIN, 0, 0, 0, head, 1.04, 0.96, 1.04)
        const hair = mesh(new THREE.SphereGeometry(0.475, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.53), HAIR, -0.05, 0.04, 0, head); hair.rotation.z = 0.28
        ball(0.12, HAIR, -0.13, 0.12, 0.4, head); ball(0.12, HAIR, -0.13, 0.12, -0.4, head)     // 양옆 뭉치
        ball(0.12, HAIR, 0.0, 0.47, 0, head); ball(0.075, HAIR, 0.06, 0.6, 0, head)               // 정수리 점토 꼬불이
        ball(0.09, SKIN, 0, -0.03, 0.46, head, 0.7, 1, 0.8); ball(0.09, SKIN, 0, -0.03, -0.46, head, 0.7, 1, 0.8)   // 귀
        for (const z of [-0.16, 0.16]) {
            ball(0.075, EYE, 0.41, 0.03, z, head, 0.55, 1.2, 1)
            ball(0.024, SHINE, 0.455, 0.075, z * 0.9, head)
            ball(0.075, CHEEK, 0.39, -0.1, z * 1.75, head, 0.5, 0.75, 1.1)
        }
        ball(0.04, mat(0xffc9a8, 1), 0.45, -0.03, 0, head)
        const smile = mesh(new THREE.TorusGeometry(0.06, 0.013, 8, 14, Math.PI), mat(0x6a2f22, 0.7), 0.44, -0.1, 0, head); smile.rotation.set(0, Math.PI / 2, Math.PI)
        // 팔다리: 짧고 통통하게
        const limb = (px, py, pz, len, r, m, endM, endR, endScale) => {
            const p = new THREE.Group(); p.position.set(px, py, pz); heroIn.add(p)
            mesh(new THREE.CapsuleGeometry(r, len, 6, 12), m, 0, -len / 2 - r * 0.3, 0, p)
            ball(endR, endM, endScale ? 0.04 : 0, -len - r * 0.95, 0, p, endScale ? 1.3 : 1, endScale ? 0.8 : 1, 1)
            return p
        }
        const legL = limb(0, 0.3, -0.17, 0.08, 0.11, PANTS, SHOE, 0.13, true), legR = limb(0, 0.3, 0.17, 0.08, 0.11, PANTS, SHOE, 0.13, true)
        const armL = limb(0, 0.8, -0.32, 0.12, 0.085, JACKET, SKIN, 0.09), armR = limb(0, 0.8, 0.32, 0.12, 0.085, JACKET, SKIN, 0.09)
        let heroAng = -0.6

        // ---------- 반짝이 (2D 로직의 sparks를 3D 구슬로)
        const sparkMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.08, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }), 160)
        sparkMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); sparkMesh.frustumCulled = false; scene.add(sparkMesh)
        sparkMesh.setColorAt(0, tmpC.set(0xffffff))

        // ---------- HUD (DOM)
        const hud = document.getElementById("hud"), hHearts = document.getElementById("hHearts"), hScore = document.getElementById("hScore"), hSlots = document.getElementById("hSlots"), hFill = document.getElementById("hFill")
        const SLOT_ICON = { camellia: "🌺", fern: "🌿", mushroom: "🍄", acorn: "🌰" }
        let hudKey = ""
        const updateHud = () => {
            hud.style.display = state === "title" ? "none" : "flex"
            const key = [hearts, maxHearts, score, [...got].join()].join("|")
            if (key !== hudKey) {
                hudKey = key
                hHearts.innerHTML = Array.from({ length: maxHearts }, (_, i) => `<span class="${i < hearts ? "on" : ""}">♥</span>`).join("")
                hScore.textContent = score
                hSlots.innerHTML = TREASURES.map((t) => `<i class="${got.has(t.type) ? "have" : ""}" title="${t.name}">${SLOT_ICON[t.type]}</i>`).join("")
            }
            hFill.style.width = Math.round(100 * Math.max(0, Math.min(1, (P.x - START_X) / (GOAL - START_X)))) + "%"
        }

        // ---------- 카메라 · 렌더
        const ZOOM = parseFloat(new URLSearchParams(location.search).get("zoom")) || 1   // 확인용: ?zoom=0.3 처럼 카메라를 가깝게
        let camXw = wx(START_X) + 2, camDist = 12
        const resize3D = () => { renderer.setSize(innerWidth, innerHeight, false) }
        addEventListener("resize", resize3D); resize3D()
        const placeCamera = () => {
            const aspect = innerWidth / innerHeight
            const d = camDist = Math.max(15, 10.8 / (0.6887 * aspect)) * ZOOM
            camera.aspect = aspect; camera.clearViewOffset()
            const shake = P.stun > 8 ? (Math.random() - 0.5) * 0.12 : 0
            camera.position.set(camXw - d * 0.1 + shake, 1 + d * 0.36 + shake, d * 0.93); camera.lookAt(camXw, 1, 0)
            camera.updateProjectionMatrix(); camera.updateMatrixWorld()
            const v = new THREE.Vector3(camXw, 0, 0).project(camera), frac = (1 - v.y) / 2
            camera.setViewOffset(innerWidth, innerHeight, 0, (frac - (touchUI() ? 0.667 : 0.66)) * innerHeight, innerWidth, innerHeight)
            scene.fog.near = d * 1.4; scene.fog.far = d * 6
        }
        const render3D = () => {
            if (builtFor !== acorns) rebuildItems()
            const px = wx(P.x), py = wy(P.y)
            camXw += ((px + (touchUI() ? 0.7 : 2.2)) - camXw) * 0.1
            camXw = Math.max(3, Math.min(LEN * U - 4, camXw))
            // 주인공
            const moving = P.onGround && Math.abs(P.vx) > 0.5, ph = P.walk * 1.9
            hero.position.set(px, py + (moving ? Math.abs(Math.sin(ph)) * 0.06 : 0), 0)
            const want = P.dir > 0 ? -0.6 : Math.PI + 0.6
            let dA = ((want - heroAng + Math.PI * 3) % (Math.PI * 2)) - Math.PI
            heroAng += dA * 0.25; hero.rotation.y = heroAng
            const sy = 1 + Math.min(0.2, Math.abs(P.vy) * 0.012); heroIn.scale.set(1 / Math.sqrt(sy), sy, 1 / Math.sqrt(sy))
            if (!P.onGround) { legL.rotation.z = 0.7; legR.rotation.z = -0.5; armL.rotation.z = -2.3; armR.rotation.z = -2.5 }
            else if (moving) { const s = Math.sin(ph) * 0.9; legL.rotation.z = s; legR.rotation.z = -s; armL.rotation.z = -s * 0.9; armR.rotation.z = s * 0.9 }
            else { legL.rotation.z = legR.rotation.z = 0; armL.rotation.z = Math.sin(time * 0.05) * 0.05 + 0.05; armR.rotation.z = -Math.sin(time * 0.05) * 0.05 - 0.05 }
            head.rotation.z = moving ? Math.sin(ph) * 0.07 : Math.sin(time * 0.04) * 0.03; head.position.y = 1.14 + (moving ? Math.abs(Math.sin(ph)) * 0.02 : 0)
            hero.visible = P.inv <= 0 || Math.floor(P.inv / 4) % 2 === 1
            // 도토리 · 보물
            for (const { o, a } of acornObjs) { o.visible = !a.taken; o.position.y = wy(a.y) + Math.sin(time * 0.07 + a.ph) * 0.07; o.rotation.y = time * 0.04 + a.ph }
            for (const { o, t } of treasureObjs) {
                o.visible = !t.taken; o.position.y = wy(t.y) + Math.sin(time * 0.05) * 0.12
                o.userData.spin.rotation.y = time * 0.03; o.userData.glow.material.opacity = 0.65 + Math.sin(time * 0.08) * 0.25
            }
            // 반짝이
            sparkMesh.count = Math.min(sparks.length, 160)
            for (let i = 0; i < sparkMesh.count; i++) {
                const s = sparks[i]; dummy.position.set(wx(s.x), wy(s.y), 0.4); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(Math.max(0.1, s.life / 24)); dummy.updateMatrix()
                sparkMesh.setMatrixAt(i, dummy.matrix); sparkMesh.setColorAt(i, tmpC.set(s.c))
            }
            sparkMesh.instanceMatrix.needsUpdate = true; if (sparkMesh.instanceColor) sparkMesh.instanceColor.needsUpdate = true
            // 하늘 시차, 구름, 깃발
            far.position.x = camXw * 0.9
            for (const c of clouds) c.position.set(camXw + ((((c.userData.bx - camXw * 0.1 + time * 0.006) % 140) + 140) % 140) - 70, c.userData.y, c.userData.z)
            if (world.userData.flag) { world.userData.flag.rotation.y = Math.sin(time * 0.06) * 0.35; world.userData.flag.scale.x = 1 + Math.sin(time * 0.1) * 0.06 }
            // 해 그림자 따라가기
            sun.position.set(px - 9, 15, 10); sun.target.position.set(px, 0, 0); sun.target.updateMatrixWorld()
            placeCamera(); updateHud()
            renderer.render(scene, camera)
        }

        // ====================================================== 메인 루프
        let last = performance.now(), acc = 0
        const loop = (now) => {
            acc += Math.min(100, now - last); last = now
            while (acc >= 1000 / 60) { acc -= 1000 / 60; if (state === "play") update(); else time++ }
            render3D()
            requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)

    </script>
</body>
</html>
